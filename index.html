<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installed-app behaviour on iPad for offline field surveys -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Allergy Voices" />
    <meta name="theme-color" content="#2b7fe0" />
    <!-- The site ships a light palette only (the .dark block in index.css is
         currently unreachable), so declare it: without this, a browser in dark
         mode renders form controls and scrollbars dark against light pages. -->
    <meta name="color-scheme" content="light" />
    <title>Allergy Voices - Every ingredient matters. Every voice counts.</title>
    <meta name="description" content="Making life with food allergies safer, easier, and more inclusive. Join our community supporting families, teens, and adults with severe food allergies." />
    <meta name="author" content="Allergy Voices" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">

    <meta property="og:title" content="Allergy Voices - Every ingredient matters. Every voice counts." />
    <meta property="og:description" content="Making life with food allergies safer, easier, and more inclusive. Join our community supporting families, teens, and adults with severe food allergies." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/allergy-voices-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@allergyvoices" />
    <meta name="twitter:image" content="/allergy-voices-logo.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TRF7BCJSJ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TRF7BCJSJ5');
    </script>
    <!-- Organization and WebSite, in the served HTML rather than injected by
         React, so a crawler that does not run JavaScript still sees them.
         Deliberately no aggregateRating, review or certification markup: we
         publish none of those things, and claiming them in schema would be a
         machine-readable version of the exact overstatement the site copy is
         careful to avoid. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://allergyvoices.com/#organization",
          "name": "AllergyVoices",
          "url": "https://allergyvoices.com",
          "logo": "https://allergyvoices.com/allergy-voices-logo.png",
          "email": "info@allergyvoices.com",
          "description": "A family-led food allergy initiative building a nationwide restaurant transparency directory, launching first in the Triangle region of North Carolina.",
          "areaServed": { "@type": "Country", "name": "United States" }
        },
        {
          "@type": "WebSite",
          "@id": "https://allergyvoices.com/#website",
          "url": "https://allergyvoices.com",
          "name": "AllergyVoices",
          "publisher": { "@id": "https://allergyvoices.com/#organization" },
          "inLanguage": "en-US"
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
