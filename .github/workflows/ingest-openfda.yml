name: Ingest — openFDA recalls

# Pulls new allergen-related recalls from the openFDA Food Enforcement API
# and opens (or updates) a pull request with the new draft files. After CI
# passes, the PR is set to auto-merge.

on:
  schedule:
    - cron: "30 12 * * *" # daily at 12:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run openFDA ingestor
        run: npx tsx scripts/ingest/openfda-recalls.ts

      - name: Validate any new content files
        run: npm run content:check

      - name: Open pull request with new recalls
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(recalls): ingest openFDA recalls"
          branch: bot/openfda-recalls
          delete-branch: true
          title: "Ingest: openFDA recall drafts"
          body: |
            Automated draft from the openFDA Food Enforcement API.

            **Auto-merge is enabled** &mdash; once CI passes (lint + content:check + build),
            this PR will merge to `main` and the recalls will go live.

            If anything looks wrong, comment `@bot pause` (or just close the PR);
            the next daily run opens a fresh one with any updates.

            Source: https://api.fda.gov/food/enforcement.json
          labels: |
            content
            recall
            bot
          add-paths: |
            content/recalls/**

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
