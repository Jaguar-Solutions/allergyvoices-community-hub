name: Deploy — Hostinger

# Builds the production bundle and uploads it to Hostinger via FTP.
#
# Triggers:
#   - push to main      → deploy immediately on your own commits
#   - schedule (15:00 UTC) → catches bot-published recalls. The recall ingestors
#     auto-merge their PRs with GITHUB_TOKEN, and GitHub does NOT trigger other
#     workflows from a GITHUB_TOKEN push, so the daily schedule is what reliably
#     ships those. 15:00 UTC is after the latest ingest cron (cfia, 13:30 UTC).
#   - workflow_dispatch → run manually to verify / force a deploy
#
# Required repository secrets:
#   FTP_HOST                      e.g. ftp.allergyvoices.com (or the IP Hostinger gives)
#   FTP_USERNAME                  Hostinger FTP account username
#   FTP_PASSWORD                  Hostinger FTP account password
#   VITE_SUPABASE_URL             real Supabase project URL (live site needs it)
#   VITE_SUPABASE_PUBLISHABLE_KEY real Supabase anon/publishable key

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let an in-progress upload finish.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: https://allergyvoices.com

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          echo "dist/ looks good:"
          ls -la dist

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # The FTP account is chrooted to its login directory, so uploads must
          # go straight there. This used to say "public_html/", which only
          # nested a second public_html inside that jail.
          #
          # This is correct ONLY once the FTP account in hPanel is pointed at
          # /domains/allergyvoices.com/public_html. As of 2026-08-08 it is
          # scoped to the account-level /home/<uid>/public_html instead, which
          # nothing serves — the verify step below will fail until that is
          # changed. If you instead make an account rooted at the home
          # directory, this becomes domains/allergyvoices.com/public_html/.
          server-dir: ./

      # Uploading successfully is not the same as being live: between June and
      # August 2026 every run here was green while the site stayed frozen,
      # because the FTP account was scoped to a directory nothing served. Fail
      # the run unless the bundle we just built is the bundle the domain hands
      # back.
      - name: Verify the live site is serving this build
        run: |
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "built:  $bundle"

          # The upload is not always visible on the first request; give the
          # origin a few seconds and retry rather than flapping.
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS -m 30 -H 'Cache-Control: no-cache' \
                     "https://allergyvoices.com/?cachebust=${GITHUB_RUN_ID}${attempt}" \
                   | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            echo "attempt $attempt — live: ${live:-<none>}"
            [ "$live" = "$bundle" ] && echo "Live site is serving this build." && exit 0
            sleep 15
          done

          echo "::error::Deploy reported success but https://allergyvoices.com is still serving '${live:-<nothing>}' instead of '$bundle'. The upload is landing somewhere the domain does not serve — check the FTP account's directory against the document root."
          exit 1
