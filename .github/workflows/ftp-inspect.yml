name: FTP — inspect server layout

# Diagnostic only. Writes a tiny marker file into each candidate directory so
# fetching it over HTTP reveals which one Apache actually serves as the
# document root for allergyvoices.com.
#
# It uploads two small text files and nothing else. Delete this workflow, and
# the two av-probe.txt files, once server-dir is confirmed.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe which directory is the document root
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # -k because FTP_HOST is a bare IP, so the TLS certificate can never
          # match it; -S so a failure is reported instead of silently empty.
          put() {
            echo "$2" > probe.txt
            curl -sS -k --ssl-reqd --connect-timeout 20 --max-time 60 \
                 --user "$USER_NAME:$PASS" \
                 -T probe.txt "ftp://$HOST/$1av-probe.txt" 2>&1 | head -5
            echo "  wrote '$2' to /$1  [curl exit $?]"
          }

          put ""             "SERVED_FROM_FTP_HOME"
          put "public_html/" "SERVED_FROM_PUBLIC_HTML"

          echo "----------------------------------------------------------"
          echo "Root listing after probe:"
          curl -sS -k --ssl-reqd --connect-timeout 20 --max-time 60 \
               --user "$USER_NAME:$PASS" "ftp://$HOST/" 2>&1 | head -30
